name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      # Offline checks only: mocks, no database, no AI or speech provider.
      - run: npm test
      - run: npm run build

  # Browser tests against a throwaway Postgres in the runner (never Supabase).
  # "chrome" uses the Google Chrome already installed on ubuntu-latest and also
  # runs at a 390 px phone width; Firefox and WebKit (Safari's engine) are
  # downloaded by Playwright with their system dependencies.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ["chrome,chrome-390", firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elw_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
